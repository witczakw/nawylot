name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nawylot
          POSTGRES_PASSWORD: nawylot
          POSTGRES_DB: nawylot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nawylot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://nawylot:nawylot@localhost:5432/nawylot_test
    steps:
      - uses: actions/checkout@v6
      # Wersja pnpm z pola packageManager w package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
